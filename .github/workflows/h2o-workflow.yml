name: H2O functional workflow verification
on:
  push:
    branches: [guided/h2o-complete-workflow]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned browser dependency
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification-output
          python3 -m venv "$RUNNER_TEMP/lgo-venv"
          "$RUNNER_TEMP/lgo-venv/bin/python" -m pip install -r requirements-verification.txt 2>&1 | tee verification-output/install.log
          "$RUNNER_TEMP/lgo-venv/bin/python" -m playwright install --with-deps chromium 2>&1 | tee verification-output/browser-install.log
      - name: Verify installed source
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/lgo-venv/bin/python" scripts/verify_batch_a.py
      - name: H2O interactive Steps 6-9
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 > verification-output/h2o-http.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for i in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:8000/ > /dev/null; then break; fi
            sleep 0.1
          done
          git rev-parse HEAD > verification-output/h2o-source-commit.txt
          "$RUNNER_TEMP/lgo-venv/bin/python" tests/browser-h2o.py http://127.0.0.1:8000/ --screenshots verification-output/screenshots 2>&1 | tee verification-output/h2o-browser.json
          git diff --exit-code HEAD
      - name: Preserve logs and tested source
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: h2o-functional-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: verification-output/
          if-no-files-found: warn
          retention-days: 14
